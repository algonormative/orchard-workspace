[package]
name = "orchard-server"
version = "0.1.0"
description = "Portable local web server for Orchard workspaces"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "orchard"
path = "src/main.rs"

[dependencies]
axum = "=0.8.6"
orchard-workspace-host = { version = "=0.1.0", path = "../orchard-workspace-host" }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "=3.23.0"
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
