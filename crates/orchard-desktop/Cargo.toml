[package]
name = "orchard-desktop"
version = "0.1.0"
description = "Orchard macOS menu bar shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "orchard-desktop"
path = "src/main.rs"

[dependencies]
orchard-server = { version = "=0.1.0", path = "../orchard-server" }
orchard-update = { version = "=0.1.0", path = "../orchard-update" }
orchard-workspace-host = { version = "=0.1.0", path = "../orchard-workspace-host" }
percent-encoding = "=2.3.2"
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-opener = "=2.5.5"
tokio = { version = "=1.47.1", features = ["time"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true
