[package]
name = "orchard-workspace-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "=0.8.6"
fs2 = "=0.4.3"
git2 = { version = "=0.20.2", default-features = false, features = ["vendored-libgit2"] }
orchard-mail-core = { version = "=0.1.0", path = "../../vendor/orchard-mail/orchard-mail-core" }
orchard-mail-mcp = { version = "=0.1.0", path = "../../vendor/orchard-mail/orchard-mail-mcp" }
rand = "=0.9.2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "=0.7.16"
tower = { version = "=0.5.2", features = ["util"] }
uuid = { version = "=1.18.1", features = ["v4"] }
wait-timeout = "=0.2.1"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "=3.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "=3.23.0"
