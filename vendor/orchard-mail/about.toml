# Reproduce THIRD_PARTY_LICENSES.txt with:
# cargo about generate --workspace --frozen --fail -o THIRD_PARTY_LICENSES.txt about.hbs
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "BSL-1.0",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "Unlicense",
]

ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false

workarounds = ["ring", "rustls"]
