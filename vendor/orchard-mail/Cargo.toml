[workspace]
members = ["orchard-mail-core", "orchard-mail-mcp", "orchard-mail-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.5.48", features = ["derive"] }
fs2 = "=0.4.3"
git2 = { version = "=0.20.2", default-features = false, features = ["vendored-libgit2"] }
hex = "=0.4.3"
http = "=1.3.1"
rmcp = { version = "=3.2.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
schemars = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "=0.7.16"
tower = { version = "=0.5.2", features = ["util"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
