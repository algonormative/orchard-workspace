# Reproduce the workspace notices with:
# cargo about generate --workspace --frozen --fail -o THIRD_PARTY_NOTICES.txt about.hbs
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]

ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false

workarounds = ["ring", "rustls"]
